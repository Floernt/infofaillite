# Taxonomie des actualités d'infofaillite.be
#
# Source unique des étiquettes (thèmes) apposées sur les notes de
# docs/actualites/. Chaque thème est rattaché aux pages théoriques du guide
# qui en exposent les règles : scripts/build_actualites.py s'en sert pour
# générer les renvois dans les deux sens.
#
# Ce fichier est hors de docs/ : il n'est jamais publié.
#
# Format :
#   slug:                      # identifiant utilisé dans le front matter des notes
#     label: Libellé affiché
#     pages: [chemin/relatif/a/docs.md, ...]

